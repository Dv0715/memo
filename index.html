<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桌面備忘小工具</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d1420">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="備忘">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{
    --bg-0:#0d1420;
    --bg-1:#131c2b;
    --bg-2:#1a2536;
    --line:#26344a;
    --text-hi:#eef2f8;
    --text-mid:#9fb0c6;
    --text-lo:#5f7288;
    --accent-blue:#5aa9e6;
    --accent-purple:#8b7ec8;
    --accent-pink:#c07ea8;
    --accent-green:#4fae8e;
    --accent-amber:#d6a84f;
    --accent-red:#c96b6b;
    --star:#e0b84f;
    --weekend-red:#8247b6;
    --holiday-red:#616269;
    --festival-purple:#cf7ac3;
    --radius:12px;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background:
      radial-gradient(ellipse at 15% 100%, rgba(90,169,230,0.06), transparent 55%),
      radial-gradient(ellipse at 85% 0%, rgba(139,126,200,0.07), transparent 55%),
      var(--bg-0);
    font-family: "PingFang TC","Microsoft JhengHei","Noto Sans TC",-apple-system,sans-serif;
    color: var(--text-hi);
  }
  #app{ max-width:1360px; margin:0 auto; padding:22px; }

  /* ---------- Alert banner ---------- */
  .alert-banner{
    display:none;
    align-items:center; gap:10px;
    background: linear-gradient(90deg, rgba(214,168,79,0.16), rgba(214,168,79,0.06));
    border:1px solid var(--accent-amber);
    border-radius:10px;
    padding:12px 16px;
    margin-bottom:16px;
    font-size:14px;
    color:#f0dfa8;
  }
  .alert-banner.show{ display:flex; }
  .alert-banner .icon{ font-size:18px; }
  .alert-banner .txt{ flex:1; }
  .alert-banner .close{ cursor:pointer; color:var(--text-lo); font-size:13px; }
  .alert-banner .close:hover{ color:var(--text-hi); }
  .alert-banner.export-tone{
    background: linear-gradient(90deg, rgba(90,169,230,0.16), rgba(90,169,230,0.06));
    border-color: var(--accent-blue);
    color:#bcdcf5;
  }
  .alert-banner.export-tone .action{
    background:var(--accent-blue); color:#0d1420; font-weight:600;
    border:none; border-radius:6px; padding:5px 12px; cursor:pointer; font-size:12.5px;
  }
  .alert-banner.export-tone .action:hover{ opacity:0.85; }

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:18px; flex-wrap:wrap; gap:10px;
  }
  .date-block h1{
    font-size:30px; margin:0; font-weight:700; letter-spacing:0.5px;
  }
  .date-block .sub{ color:var(--text-mid); font-size:13px; margin-top:2px;}
  .meta{ display:flex; gap:18px; align-items:center; color:var(--text-mid); font-size:14px; flex-wrap:wrap;}
  .meta span{ display:flex; align-items:center; gap:6px;}
  .meta .icon{ font-size:15px; }

  /* ---------- Layout grid ---------- */
  .grid{
    display:grid;
    grid-template-columns: 1.55fr 1fr;
    gap:18px;
    align-items:start;
  }
  @media (max-width:980px){ .grid{ grid-template-columns:1fr; } }
.left-column,
.right-column{
    display:flex;
    flex-direction:column;
    gap:16px;
}
  .panel{
    background: var(--bg-1);
    border:1px solid var(--line);
    border-radius: var(--radius);
    padding:16px 18px 18px;
  }
  
  .panel-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 4px 12px;
    font-weight:700; font-size:15px;
  }
  .panel-header .title{ display:flex; align-items:center; gap:8px; }
  .pin{ opacity:0.6; font-size:14px; cursor:pointer; user-select:none; }
  .pin:hover{ opacity:1; }

  .header-purple{ background:linear-gradient(90deg, rgba(139,126,200,0.18), transparent); border-radius:10px 10px 0 0; margin:-16px -18px 8px; padding:14px 18px; color:#c9c2ec;}
  .header-pink{ background:linear-gradient(90deg, rgba(192,126,168,0.18), transparent); border-radius:10px 10px 0 0; margin:-16px -18px 8px; padding:14px 18px; color:#e0b9d0;}
  .header-amber{ background:linear-gradient(90deg, rgba(214,168,79,0.16), transparent); border-radius:10px 10px 0 0; margin:-16px -18px 8px; padding:14px 18px; color:#e6cd8f;}
  .header-green{ background:linear-gradient(90deg, rgba(79,174,142,0.16), transparent); border-radius:10px 10px 0 0; margin:-16px -18px 8px; padding:14px 18px; color:#9fd6bf;}
  .header-blue{ background:linear-gradient(90deg, rgba(90,169,230,0.16), transparent); border-radius:10px 10px 0 0; margin:-16px -18px 8px; padding:14px 18px; color:#a8d1ef;}

  /* ---------- Calendar ---------- */
  .cal-weekdays{
    display:grid; grid-template-columns:repeat(7,1fr);
    color:var(--text-mid); font-size:13px; padding:6px 2px;
  }
  .cal-weekdays div{ text-align:left; padding:4px 6px; }
  .cal-grid{
    display:grid; grid-template-columns:repeat(7,1fr);
    grid-auto-rows: 115px;
    gap:6px;
  }
  .cal-cell{
    border:1px solid var(--line);
    border-radius:8px;
    padding:6px 8px;
    font-size:12px;
    color:var(--text-mid);
    position:relative;
    overflow:hidden;
    cursor:pointer;
    transition:border-color .15s, background .15s, transform .15s, box-shadow .15s;
  }
  .cal-cell:hover{
    border-color:var(--accent-blue);
    background:rgba(90,169,230,.08);
    transform:translateY(-2px);
}
  .cal-cell.out{ opacity:0.35; }
.cal-cell.today{
    border-color:#5aa9e6;
    background:rgba(90,169,230,.18);
    box-shadow:
        0 0 0 1px #5aa9e6 inset,
        0 0 12px rgba(90,169,230,.45);
}
  .cal-cell.weekend .num{ color:var(--weekend-red); }
  .cal-cell .num{ font-size:14px; font-weight:600; color:var(--text-hi); }
  .cal-cell .lunar{ font-size:11px; color:var(--text-lo); margin-left:4px; }
  .cal-cell .events{ margin-top:4px; display:flex; flex-direction:column; gap:2px; }
  .cal-cell .ev{
    display:flex; align-items:center; gap:4px; font-size:10.5px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text-mid);
  }
  .cal-cell .ev .dot{ width:5px; height:5px; border-radius:50%; flex:none; }

  /* ---------- month nav ---------- */
  .month-nav{ display:flex; gap:8px; align-items:center; }
  .month-nav button{
    background:var(--bg-2); border:1px solid var(--line); color:var(--text-hi);
    border-radius:6px; padding:4px 10px; cursor:pointer; font-size:13px;
  }
  .month-nav button:hover{ border-color:var(--accent-blue); }

  /* ---------- Notes ---------- */
  .note-item{ padding:10px 2px; border-bottom:1px dashed var(--line); }
  .note-item:last-child{ border-bottom:none; }
  .note-title{ font-weight:600; font-size:14px; display:flex; align-items:center; gap:6px; margin-bottom:4px;}
  .note-title .dot{ width:6px; height:6px; border-radius:50%; }
  .note-body{ font-size:13px; color:var(--text-mid); white-space:pre-wrap; line-height:1.6; padding-left:14px; }
  .note-body[contenteditable="true"]{ outline:none; }
  .note-body[contenteditable="true"]:focus{ background:rgba(255,255,255,0.02); border-radius:6px; }
  .note-del{ float:right; font-size:11px; color:var(--text-lo); cursor:pointer; opacity:0; transition:opacity .15s;}
  .note-item:hover .note-del{ opacity:1; }
  .note-del:hover{ color:var(--accent-red); }
  .add-line{
    display:flex; align-items:center; gap:6px; color:var(--text-lo);
    font-size:13px; cursor:pointer; padding:8px 2px 2px; user-select:none;
  }
  .add-line:hover{ color:var(--accent-blue); }

  /* ---------- Todo ---------- */
  .todo-row{
    display:flex; align-items:center; gap:10px; padding:8px 2px;
    border-bottom:1px dashed var(--line); font-size:13.5px;
  }
  .todo-row:last-of-type{ border-bottom:none; }
  .todo-row input[type=checkbox]{
    width:15px; height:15px; accent-color: var(--accent-green); cursor:pointer; flex:none;
  }
  .todo-row .txt{ flex:1; outline:none; }
  .todo-row .txt.done{ text-decoration:line-through; color:var(--text-lo); }
  .todo-row .star{ cursor:pointer; color:var(--text-lo); font-size:14px; }
  .todo-row .star.on{ color:var(--star); }
  .todo-row .del{ cursor:pointer; color:var(--text-lo); font-size:12px; opacity:0; }
  .todo-row:hover .del{ opacity:1; }
  .todo-row .del:hover{ color:var(--accent-red); }

  /* ---------- Weekly focus ---------- */
  .focus-item{ padding:10px 2px; }
  .focus-top{ display:flex; align-items:center; justify-content:space-between; font-size:13.5px; margin-bottom:3px;}
  .focus-top .name{ font-weight:600; display:flex; align-items:center; gap:6px; }
  .focus-top .name .dot{ width:6px; height:6px; border-radius:50%; }
  .focus-top .pct{ color:var(--text-mid); font-size:12.5px; }
  .focus-sub{ font-size:12px; color:var(--text-lo); margin-bottom:6px; padding-left:14px;}
  .bar-track{ height:6px; background:var(--bg-2); border-radius:4px; overflow:hidden; margin-left:14px;}
  .bar-fill{ height:100%; border-radius:4px; }

  /* ---------- Reminders ---------- */
  .rem-row{
    display:flex; align-items:center; gap:12px; padding:9px 2px;
    border-bottom:1px dashed var(--line); font-size:13px;
  }
  .rem-row:last-of-type{ border-bottom:none; }
  .rem-date{ color:var(--accent-blue); font-weight:600; width:64px; flex:none; }
  .rem-title{ flex:1; }
  .rem-days{ color:var(--text-lo); font-size:12px; }
  .rem-del{ cursor:pointer; color:var(--text-lo); font-size:12px; opacity:0; }
  .rem-row:hover .rem-del{ opacity:1; }
  .rem-del:hover{ color:var(--accent-red); }

  input.plain{
    background:transparent; border:none; color:var(--text-hi); font-size:13.5px;
    outline:none; width:100%; font-family:inherit;
  }
  input.plain::placeholder{ color: var(--text-lo); }

  .footer{
    display:flex; justify-content:space-between; align-items:center;
    color:var(--text-lo); font-size:11.5px; margin-top:18px; padding:0 4px;
  }
  .footer button{
    background:none; border:none; color:var(--text-lo); cursor:pointer; font-size:16px; margin-right:10px;
  }
  .footer button:hover{ color:var(--text-hi); }

  /* modal for day detail */
  .modal-bg{
    position:fixed; inset:0; background:rgba(5,8,14,0.6); display:none;
    align-items:center; justify-content:center; z-index:50;
  }
  .modal-bg.show{ display:flex; }
  .modal{
    background:var(--bg-1); border:1px solid var(--line); border-radius:12px;
    padding:18px 20px; width:min(900px,90vw); max-height:85vh; overflow:auto;
  }
  .modal h3{ margin:0 0 10px; font-size:15px; }
  .modal .ev-line{ display:flex; gap:8px; align-items:center; padding:6px 0; font-size:13px; cursor:pointer; }
  .modal .ev-line .dot{ width:6px; height:6px; border-radius:50%; flex:none; }
  .modal .ev-line span.ev-text{ flex:1; }
  .modal .ev-line .expand-arrow{ font-size:10px; color:var(--text-lo); transition:transform .15s; flex:none; }
  .modal .ev-line.expanded .expand-arrow{ transform:rotate(90deg); }
  .modal .ev-detail{ padding:2px 0 10px 14px; }
  .modal .ev-detail textarea{

    width:100%;

    min-height:250px;

    max-height:60vh;

    resize:vertical; background:var(--bg-2); border:1px solid var(--line);
    border-radius:8px; color:var(--text-hi); font-size:12.5px; padding:8px; font-family:inherit;
    resize:vertical; outline:none; box-sizing:border-box;
  }
  .modal .ev-detail textarea:focus{ border-color:var(--accent-blue); }
  .modal .ev-detail .hint{ font-size:11px; color:var(--text-lo); margin-top:4px; }
  .modal .ev-del{ cursor:pointer; color:var(--text-lo); font-size:11px;}
  .modal .ev-del:hover{ color:var(--accent-red); }
  .modal .ev-lock{ cursor:pointer; color:var(--text-lo); font-size:12px; opacity:0.7; }
  .modal .ev-lock:hover{ opacity:1; color:var(--holiday-red); }
  .color-picker-row{
    display:flex; align-items:center; gap:7px; margin-top:10px; padding:0 2px;
    flex-wrap:wrap;
  }
  .color-picker-row .label{ font-size:11px; color:var(--text-lo); margin-right:2px; }
  .color-swatch{
    width:18px; height:18px; border-radius:50%; cursor:pointer;
    border:2px solid transparent; box-sizing:border-box;
    transition:transform .1s, border-color .1s;
  }
  .color-swatch:hover{ transform:scale(1.15); }
  .color-swatch.selected{ border-color:var(--text-hi); transform:scale(1.15); }
  .modal-close{ text-align:right; margin-top:8px; }
  .modal-close button{
    background:var(--bg-2); border:1px solid var(--line); color:var(--text-hi);
    padding:5px 12px; border-radius:6px; cursor:pointer; font-size:12.5px;
  }

.search-box{

    display:flex;
    align-items:center;
    gap:8px;

    margin-top:12px;

}

.search-box input{

    width:260px;

    background:var(--bg-2);

    border:1px solid var(--line);

    color:white;

    padding:8px 12px;

    border-radius:8px;

}

/* ==========================
   搜尋結果
========================== */

.search-results{

    display:none;

    margin-bottom:18px;

    background:var(--bg-1);

    border:1px solid var(--line);

    border-radius:12px;

    padding:10px;

}

.search-results.show{

    display:block;

}

.search-result{

    padding:10px;

    border-bottom:1px dashed var(--line);

    cursor:pointer;

    transition:.15s;

}

.search-result:last-child{

    border-bottom:none;

}

.search-result:hover{

    background:rgba(90,169,230,.08);

}

.search-date{

    color:var(--accent-blue);

    font-size:12px;

}

.search-title{

    font-weight:bold;

    margin-top:3px;

}

.search-note{

    color:var(--text-mid);

    font-size:12px;

    margin-top:4px;

    white-space:pre-wrap;

}

.search-highlight{

    background:rgba(255,213,79,.35);

    color:#ffd54f;

    border-bottom:2px solid #ffd54f;

    font-weight:600;

    padding:0 1px;

}

.modal .ev-detail .ev-title{

    width:100%;

    background:var(--bg-2);

    border:1px solid var(--line);

    border-radius:8px;

    color:var(--text-hi);

    padding:8px;

    margin-bottom:8px;

    font-size:13px;

    outline:none;

    box-sizing:border-box;

}

.modal .ev-detail .ev-title:focus{

    border-color:var(--accent-blue);

}


  /* ---------- Invoices ---------- */
  .invoice-panel{ margin-top:16px; }
  .invoice-search{ display:flex; gap:8px; margin:8px 0 10px; }
  .invoice-search input{
    flex:1; background:var(--bg-2); border:1px solid var(--line);
    color:var(--text-hi); padding:8px 10px; border-radius:8px;
    outline:none; font-family:inherit; font-size:13px;
  }
  .invoice-search input:focus{ border-color:var(--accent-green); }
  .invoice-row{
    padding:10px 2px; border-bottom:1px dashed var(--line);
    cursor:pointer;
  }
  .invoice-row:last-child{ border-bottom:none; }
  .invoice-row:hover{ background:rgba(79,174,142,.06); border-radius:7px; }
  .invoice-main{ display:flex; gap:9px; align-items:baseline; }
  .invoice-date{ color:var(--accent-green); font-size:12px; min-width:76px; }
  .invoice-number{ font-weight:700; letter-spacing:.4px; }
  .invoice-company{ color:var(--text-mid); margin-left:auto; text-align:right; }
  .invoice-sub{ color:var(--text-lo); font-size:12px; margin-top:4px; padding-left:85px; }
  .invoice-amount{ color:var(--accent-amber); margin-left:8px; }
  .invoice-empty{ color:var(--text-lo); font-size:12.5px; padding:8px 2px; }
  .invoice-add{
    display:flex; gap:7px; flex-wrap:wrap; margin-top:10px;
    padding-top:10px; border-top:1px solid var(--line);
  }
  .invoice-add input{
    background:var(--bg-2); border:1px solid var(--line); color:var(--text-hi);
    border-radius:6px; padding:7px 8px; font-family:inherit; font-size:12.5px;
    outline:none;
  }
  .invoice-add input:focus{ border-color:var(--accent-green); }
  .invoice-add .inv-date{ width:132px; }
  .invoice-add .inv-number{ width:145px; }
  .invoice-add .inv-company{ flex:1; min-width:150px; }
  .invoice-add .inv-item{ flex:1; min-width:150px; }
  .invoice-add .inv-amount{ width:110px; }
  .invoice-add .inv-note{ flex:1; min-width:180px; }
  .invoice-add button{
    background:var(--accent-green); color:#0d1420; border:none;
    border-radius:6px; padding:7px 13px; cursor:pointer; font-weight:600;
  }
  .invoice-add button:hover{ opacity:.85; }
  .invoice-edit{
    display:none; margin-top:8px; padding:10px; background:var(--bg-2);
    border:1px solid var(--line); border-radius:8px;
  }
  .invoice-edit.show{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; }
  .invoice-edit input,.invoice-edit textarea{
    background:transparent; border:1px solid var(--line); color:var(--text-hi);
    border-radius:6px; padding:7px 8px; font-family:inherit; font-size:12.5px;
    outline:none;
  }
  .invoice-edit textarea{ min-height:54px; resize:vertical; grid-column:1/-1; }
  .invoice-edit .wide{ grid-column:1/-1; }
  .invoice-edit .actions{ grid-column:1/-1; display:flex; gap:7px; justify-content:flex-end; }
  .invoice-edit button{
    background:var(--bg-1); border:1px solid var(--line); color:var(--text-hi);
    border-radius:6px; padding:6px 12px; cursor:pointer;
  }
  .invoice-edit button.save{ background:var(--accent-green); color:#0d1420; border:none; }
  .invoice-edit button.del:hover{ border-color:var(--accent-red); color:var(--accent-red); }

</style>
</head>
<body>
<div id="app">

  <div class="alert-banner" id="alertBanner">
    <span class="icon">🔔</span>
    <span class="txt" id="alertBannerText"></span>
    <span class="close" id="alertBannerClose">關閉</span>
  </div>

  <div class="alert-banner export-tone" id="exportBanner">
    <span class="icon">💾</span>
    <span class="txt" id="exportBannerText"></span>
    <button class="action" id="exportBannerAction">立即匯出</button>
    <span class="close" id="exportBannerClose">稍後</span>
  </div>

  <div class="topbar">
    <div class="date-block">
      <h1 id="bigDate">2025 / 07</h1>
      <div class="sub" id="monthLabel">七月</div>
    </div>
    <div class="meta">
      <div class="search-box">

    🔍

    <input
        id="globalSearch"
        type="text"
        placeholder="搜尋事件、筆記..."

    >

</div>
      <span class="icon">☁️</span><span id="metaWeather">多雲 28°C</span>
      <span class="icon">🕐</span><span id="metaTime">09:22</span>
      <span class="icon">📅</span><span id="metaWeekday">星期日</span>
    </div>
  </div>

<div id="searchResults" class="search-results"></div>

  <div class="grid">
    <!-- LEFT COLUMN -->
    <div class="left-column">
      <div class="panel">
        <div class="panel-header">
          <div class="title">📆 月曆</div>
          <div class="month-nav">
            <button id="importHolidaysBtn" title="匯入2026台灣國定假日與節日">🇹🇼 匯入假日</button>
            <button id="prevMonth">←</button>
            <button id="todayBtn">今天</button>
            <button id="nextMonth">→</button>
          </div>
        </div>
        <div class="cal-weekdays">
          <div>週一</div><div>週二</div><div>週三</div><div>週四</div><div>週五</div><div>週六</div><div>週日</div>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div>

      <div class="panel">
        <div class="panel-header"><div class="title">📋 待辦清單</div></div>
        <div id="todoList"></div>
        <div class="add-line" id="addTodo">＋ 新增待辦</div>
      </div>

      <div class="panel">
        <div class="panel-header"><div class="title">🗓 本週重點</div></div>
        <div id="focusList"></div>
        <div class="add-line" id="addFocus">＋ 新增項目</div>
      </div>
    </div>

    <!-- RIGHT COLUMN -->
    <div class="right-column">
      <div class="panel">
        <div class="header-purple panel-header">
          <div class="title">📌 工作筆記</div>
          <span class="pin">📍</span>
        </div>
        <div id="workNotes"></div>
        <div class="add-line" id="addWorkNote">＋ 新增筆記</div>
      </div>

      <div class="panel">

<script>
(function(){
  const STORE_KEY = "desktopWidgetData_v1";
  const WEEKDAY_CN = ["日","一","二","三","四","五","六"];
  const LUNAR_MONTH = ["正","二","三","四","五","六","七","八","九","十","冬","臘"];
  const LUNAR_DAY = ["初一","初二","初三","初四","初五","初六","初七","初八","初九","初十",
    "十一","十二","十三","十四","十五","十六","十七","十八","十九","二十",
    "廿一","廿二","廿三","廿四","廿五","廿六","廿七","廿八","廿九","三十"];

  // ---- simple lunar approximation using a fixed offset table isn't available offline;
  // fallback: show a cyclic day count if no lunar lib is present. We keep it lightweight
  // and approximate using day-of-year mod, purely for flavor like the reference image.
function getLunar(date){

    const lunar = new Intl.DateTimeFormat(
        "zh-TW-u-ca-chinese",
        {
            month: "numeric",
            day: "numeric"
        }
    ).format(date);

    return lunar;
}

  const DOT_COLORS = {
    red:"var(--accent-red)", blue:"var(--accent-blue)", green:"var(--accent-green)",
    amber:"var(--accent-amber)", purple:"var(--accent-purple)", pink:"var(--accent-pink)",
    holiday:"var(--holiday-red)", festival:"var(--festival-purple)"
  };

  let state = loadState();
  migrateHolidayColors();
  function defaultState(){
    return {
      events: {},        // "2025-07-06": [{text, color}]
      todos: [
        {text:"歡迎使用～點我可以打勾", done:false, star:true}
      ],
      focus: [
        {name:"範例項目", sub:"點擊可編輯說明", pct:30, color:"blue"}
      ],
      workNotes: [
        {title:"工作筆記範例", body:"在這裡記錄工作上的細節、規格、流程等。", color:"blue"}
      ],
      quickNotes: [
        {title:"隨手筆記範例", body:"臨時想到的小事都可以先記在這。", color:"pink"}
      ],
      reminders: [
        {date:"", title:"每月固定提醒範例（點「每月」文字可切換）", days:"", monthly:true, day:22}
      ],
      invoices: [],
      viewYear: new Date().getFullYear(),
      viewMonth: new Date().getMonth() // 0-indexed
    };
  }
  function loadState(){
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(raw) return Object.assign(defaultState(), JSON.parse(raw));
    }catch(e){}
    return defaultState();
  }
  function saveState(){
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
    if(window.__memoSync) window.__memoSync.onLocalSave(state);
  }
  window.__memoApp = {
    getState: ()=>state,
    applyRemote: (remote)=>{
      const keepY = state.viewYear, keepM = state.viewMonth;
      state = Object.assign(defaultState(), remote, {viewYear: keepY, viewMonth: keepM});
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
      renderAll();
    }
  };
  if(!Array.isArray(state.invoices)) state.invoices = [];

  // 修正舊版匯入的假日/節日資料：早期版本用 color:"red"/"purple"，
  // 現在改用專屬的 color:"holiday"/"festival"，這裡自動校正舊資料並存回。
  function migrateHolidayColors(){
    let changed = false;
    Object.keys(state.events || {}).forEach(dateKey=>{
      state.events[dateKey].forEach(e=>{
        if(e.note === "國定假日（放假）" && e.color !== "holiday"){
          e.color = "holiday"; changed = true;
        } else if(e.note === "節日（不放假）" && e.color !== "festival"){
          e.color = "festival"; changed = true;
        }
      });
    });
    if(changed) saveState();
  }

  function fmtKey(y,m,d){
    return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }

function sortEvents(events){

    return [...events].sort((a,b)=>{

        const ta = a.text.match(/^(\d{1,2}):(\d{2})/);
        const tb = b.text.match(/^(\d{1,2}):(\d{2})/);

        // 都沒有時間
        if(!ta && !tb) return 0;

        // 有時間的排前面
        if(ta && !tb) return -1;
        if(!ta && tb) return 1;

        // 比較時間
        const ma = Number(ta[1])*60 + Number(ta[2]);
        const mb = Number(tb[1])*60 + Number(tb[2]);

        return ma-mb;

    });

}

  // ---------- Top bar clock ----------
  function renderClock(){
    const now = new Date();
    document.getElementById("metaTime").textContent =
      String(now.getHours()).padStart(2,'0')+":"+String(now.getMinutes()).padStart(2,'0');
    document.getElementById("metaWeekday").textContent = "星期"+"日一二三四五六"[now.getDay()];
  }
  renderClock();
  setInterval(renderClock, 15000);

  // ---------- Calendar ----------
  function renderCalendar(){
    const y = state.viewYear, m = state.viewMonth;
    document.getElementById("bigDate").textContent = `${y} / ${String(m+1).padStart(2,'0')}`;
    document.getElementById("monthLabel").textContent = ["一","二","三","四","五","六","七","八","九","十","十一","十二"][m]+"月";

    const grid = document.getElementById("calGrid");
    grid.innerHTML = "";

    const firstOfMonth = new Date(y, m, 1);
    // convert JS Sun=0..Sat=6 to Mon-first index
    let startOffset = (firstOfMonth.getDay() + 6) % 7;
    const daysInMonth = new Date(y, m+1, 0).getDate();
    const daysInPrevMonth = new Date(y, m, 0).getDate();
    const today = new Date();

    const cells = [];
    for(let i=0;i<startOffset;i++){
      const dnum = daysInPrevMonth - startOffset + 1 + i;
      cells.push({dnum, out:true, y: m===0? y-1:y, m: (m+11)%12});
    }
    for(let d=1; d<=daysInMonth; d++){
      cells.push({dnum:d, out:false, y, m});
    }
    while(cells.length % 7 !== 0 || cells.length < 42){
      const idxInNext = cells.length - (startOffset+daysInMonth);
      cells.push({dnum: idxInNext, out:true, y: m===11? y+1:y, m:(m+1)%12});
      if(cells.length >= 42) break;
    }

    cells.forEach(c=>{
      const div = document.createElement("div");
      div.className = "cal-cell" + (c.out?" out":"");
      const dateObj = new Date(c.y, c.m, c.dnum);
      const isToday = !c.out && dateObj.toDateString() === today.toDateString();
      if(isToday) div.className += " today";
      const dow = dateObj.getDay();
      if(dow===0 || dow===6) div.className += " weekend";

      const key = fmtKey(c.y, c.m, c.dnum);
      const evs = sortEvents(state.events[key] || []);

      div.innerHTML = `
        <span class="num">${c.dnum}</span><span class="lunar">${getLunar(dateObj)}</span>
        <div class="events">
          ${evs.slice(0,5).map(e=>`<div class="ev" style="color:${DOT_COLORS[e.color]||DOT_COLORS.blue}"><span class="dot" style="background:${DOT_COLORS[e.color]||DOT_COLORS.blue}"></span>${escapeHtml(e.text)}${e.note?' 📝':''}</div>`).join("")}
          ${evs.length>4? `<div class="ev" style="color:var(--text-lo)">+${evs.length-5} 更多</div>`:""}
        </div>
      `;
      div.addEventListener("click", ()=> openDayModal(c.y, c.m, c.dnum));
      grid.appendChild(div);
    });
  }

  document.getElementById("prevMonth").onclick = ()=>{
    state.viewMonth--; if(state.viewMonth<0){state.viewMonth=11; state.viewYear--;}
    saveState(); renderCalendar();
  };
  document.getElementById("nextMonth").onclick = ()=>{
    state.viewMonth++; if(state.viewMonth>11){state.viewMonth=0; state.viewYear++;}
    saveState(); renderCalendar();
  };
  document.getElementById("todayBtn").onclick = ()=>{
    const now = new Date();
    state.viewYear = now.getFullYear(); state.viewMonth = now.getMonth();
    saveState(); renderCalendar();
  };

  // ---------- Taiwan 2026 holidays / festivals import ----------
  // 資料來源：行政院人事行政總處 115年(2026)政府行政機關辦公日曆表，
  // 以及農民曆節日對照（元宵、七夕、中元、重陽等）。
  const TW_2026_HOLIDAYS = [
    // ---- 國定假日（含補假），紅色 ----
    {date:"2026-01-01", text:"元旦", type:"holiday"},
    {date:"2026-02-15", text:"小年夜", type:"holiday"},
    {date:"2026-02-16", text:"除夕", type:"holiday"},
    {date:"2026-02-17", text:"春節（初一）", type:"holiday"},
    {date:"2026-02-18", text:"春節（初二）", type:"holiday"},
    {date:"2026-02-19", text:"春節（初三）", type:"holiday"},
    {date:"2026-02-20", text:"小年夜補假", type:"holiday"},
    {date:"2026-02-27", text:"和平紀念日補假", type:"holiday"},
    {date:"2026-02-28", text:"和平紀念日", type:"holiday"},
    {date:"2026-04-03", text:"兒童節補假", type:"holiday"},
    {date:"2026-04-04", text:"兒童節", type:"holiday"},
    {date:"2026-04-05", text:"清明節", type:"holiday"},
    {date:"2026-04-06", text:"清明節補假", type:"holiday"},
    {date:"2026-05-01", text:"勞動節", type:"holiday"},
    {date:"2026-06-19", text:"端午節", type:"holiday"},
    {date:"2026-09-25", text:"中秋節", type:"holiday"},
    {date:"2026-09-28", text:"教師節（孔子誕辰紀念日）", type:"holiday"},
    {date:"2026-10-09", text:"國慶日補假", type:"holiday"},
    {date:"2026-10-10", text:"國慶日", type:"holiday"},
    {date:"2026-10-25", text:"台灣光復節", type:"holiday"},
    {date:"2026-10-26", text:"台灣光復節補假", type:"holiday"},
    {date:"2026-12-25", text:"行憲紀念日", type:"holiday"},
    // ---- 單純節日（不放假），紫色 ----
    {date:"2026-02-14", text:"西洋情人節", type:"festival"},
    {date:"2026-03-03", text:"元宵節", type:"festival"},
    {date:"2026-03-08", text:"婦女節", type:"festival"},
    {date:"2026-03-29", text:"青年節", type:"festival"},
    {date:"2026-05-10", text:"母親節", type:"festival"},
    {date:"2026-08-08", text:"父親節", type:"festival"},
    {date:"2026-08-19", text:"七夕情人節", type:"festival"},
    {date:"2026-08-27", text:"中元節", type:"festival"},
    {date:"2026-09-03", text:"軍人節", type:"festival"},
    {date:"2026-10-18", text:"重陽節", type:"festival"},
    {date:"2026-10-31", text:"萬聖節", type:"festival"},
    {date:"2026-11-12", text:"國父誕辰紀念日", type:"festival"},
    {date:"2026-12-25", text:"聖誕節", type:"festival"}
  ];
  document.getElementById("importHolidaysBtn").onclick = ()=>{
    if(!confirm("要匯入 2026 年台灣國定假日與節日嗎？\n（放假日會標紅色，單純節日標紫色，不會覆蓋你原有的事件）")) return;
    let added = 0;
    TW_2026_HOLIDAYS.forEach(h=>{
      if(!state.events[h.date]) state.events[h.date] = [];
      const exists = state.events[h.date].some(e=> e.text === h.text);
      if(!exists){
        state.events[h.date].push({
          text: h.text,
          color: h.type === "holiday" ? "holiday" : "festival",
          note: h.type === "holiday" ? "國定假日（放假）" : "節日（不放假）",
          locked: true
        });
        added++;
      }
    });
    saveState(); renderCalendar();
    alert(`已匯入 ${added} 筆假日／節日資料！`);
  };

  // ---------- Day modal ----------
  let currentDayKey = null;
  let expandedEventIndex = null;
  let selectedEventColor = "blue";
  const QUICK_COLORS = [
    {c:"blue",  label:"工作"},
    {c:"amber", label:"提醒"},
    {c:"purple",label:"心情"},
    {c:"pink",  label:"特別"},
    {c:"green", label:"完成"},
    {c:"red",   label:"重要"},
    {c:"holiday",  label:"假日"},
    {c:"festival", label:"節日"}
  ];
  function renderColorPicker(){
    const row = document.getElementById("colorPickerRow");
    row.innerHTML = `<span class="label">新增事件顏色：</span>` + QUICK_COLORS.map(q=>`
      <span class="color-swatch ${selectedEventColor===q.c?'selected':''}"
            style="background:${DOT_COLORS[q.c]}" data-c="${q.c}" title="${q.label}"></span>
    `).join("");
    row.querySelectorAll(".color-swatch").forEach(el=>{
      el.onclick = ()=>{
        selectedEventColor = el.dataset.c;
        renderColorPicker();
      };
    });
  }
  function openDayModal(y,m,d){
    currentDayKey = fmtKey(y,m,d);
    expandedEventIndex = null;
    selectedEventColor = "blue";
    document.getElementById("dayModalTitle").textContent = `${m+1}月${d}日`;
    renderColorPicker();
    renderDayModalEvents();
    document.getElementById("dayModalBg").classList.add("show");
    document.getElementById("dayModalInput").value = "";
    document.getElementById("dayModalInput").focus();
  }
  function renderDayModalEvents(){
    const evs = state.events[currentDayKey] || [];
    const box = document.getElementById("dayModalEvents");
    if(evs.length===0){
      box.innerHTML = `<div style="color:var(--text-lo); font-size:12.5px; padding:6px 0;">尚無事件</div>`;
      return;
    }
    box.innerHTML = evs.map((e,i)=>{
      const isOpen = expandedEventIndex === i;
      const delControl = e.locked
        ? `<span class="ev-lock" data-i="${i}" title="已鎖定，點擊可解鎖後刪除">🔒</span>`
        : `<span class="ev-del" data-i="${i}">刪除</span>`;
      return `
      <div class="ev-line ${isOpen?'expanded':''}" data-i="${i}">
        <span class="dot" style="background:${DOT_COLORS[e.color]||DOT_COLORS.blue}"></span>
        <input

    class="ev-title"

    data-i="${i}"

    value="${escapeHtml(e.text)}"

    style="
        flex:1;
        background:transparent;
        border:none;
        color:${DOT_COLORS[e.color]||DOT_COLORS.blue};
        font-size:13px;
        font-weight:600;
        outline:none;
    "

>
        <span class="expand-arrow">▶</span>
        ${delControl}
      </div>
      ${isOpen ? `
    <div class="ev-detail">

        <input
            class="ev-title"
            data-i="${i}"
            value="${escapeHtml(e.text)}"
            placeholder="事件標題"
        >

        <textarea
            placeholder="寫下更詳細的筆記、心得…"
            data-i="${i}"
        >${escapeHtml(e.note||"")}</textarea>

        <div class="hint">
            點擊外面自動儲存
        </div>
          ${e.locked
            ? `<div class="hint" style="margin-top:8px;">🔒 已鎖定的假日資料，需先解鎖才能改顏色</div>`
            : `
              <div class="color-picker-row" style="margin-top:8px;">
                <span class="label">改顏色：</span>
                ${QUICK_COLORS.map(q=>`
                  <span class="color-swatch edit-color-swatch ${e.color===q.c?'selected':''}"
                        style="background:${DOT_COLORS[q.c]}" data-i="${i}" data-c="${q.c}" title="${q.label}"></span>
                `).join("")}
              </div>
            `
          }
        </div>
      ` : ""}
      `;
    }).join("");

    box.querySelectorAll(".ev-line").forEach(el=>{
      el.addEventListener("click", (ev)=>{
        if(ev.target.classList.contains("ev-del") || ev.target.classList.contains("ev-lock")) return;
        const i = +el.dataset.i;
        expandedEventIndex = (expandedEventIndex === i) ? null : i;
        renderDayModalEvents();
      });
    });
    box.querySelectorAll(".edit-color-swatch").forEach(el=>{
      el.addEventListener("click", (ev)=>{
        ev.stopPropagation();
        const i = +el.dataset.i;
        state.events[currentDayKey][i].color = el.dataset.c;
        saveState();
        renderDayModalEvents();
        renderCalendar();
      });
    });

box.querySelectorAll(".ev-title").forEach(el=>{

    el.addEventListener("blur",()=>{

        const i = Number(el.dataset.i);

        state.events[currentDayKey][i].text = el.value.trim();

        saveState();

        renderCalendar();

        renderDayModalEvents();   // 更新上面的標題

    });

});

    box.querySelectorAll(".ev-detail textarea").forEach(el=>{
      el.addEventListener("click", (e)=> e.stopPropagation());
      el.addEventListener("blur", (e)=>{
        const i = +el.dataset.i;
        state.events[currentDayKey][i].note = e.target.value.trim();
        saveState();
      });
    });
    box.querySelectorAll(".ev-del").forEach(el=>{
      el.onclick = (ev)=>{
        ev.stopPropagation();
        const i = +el.dataset.i;
        state.events[currentDayKey].splice(i,1);
        if(expandedEventIndex === i) expandedEventIndex = null;
        saveState(); renderDayModalEvents(); renderCalendar();
      };
    });
    box.querySelectorAll(".ev-lock").forEach(el=>{
      el.onclick = (ev)=>{
        ev.stopPropagation();
        const i = +el.dataset.i;
        if(confirm("這是節日/假日資料，已鎖定保護。要解除鎖定以便刪除嗎？")){
          state.events[currentDayKey][i].locked = false;
          saveState(); renderDayModalEvents();
        }
      };
    });
  }
  document.getElementById("dayModalInput").addEventListener("keydown", (e)=>{
    if(e.key === "Enter"){
      const val = e.target.value.trim();
      if(!val) return;
      if(!state.events[currentDayKey]) state.events[currentDayKey] = [];
      state.events[currentDayKey].push({text:val, color:selectedEventColor, note:""});
      e.target.value = "";
      saveState(); renderDayModalEvents(); renderCalendar();
    }
  });
  document.getElementById("dayModalClose").onclick = ()=>{
    document.getElementById("dayModalBg").classList.remove("show");
  };
  document.getElementById("dayModalBg").addEventListener("click",(e)=>{

  // ---------- Reminders ----------
  function daysFromToday(dateStr){
    if(!dateStr) return "";
    const target = new Date(dateStr);
    const now = new Date(); now.setHours(0,0,0,0);
    target.setHours(0,0,0,0);
    const diff = Math.round((target-now)/86400000);
    if(diff===0) return "今天";
    if(diff<0) return `已過 ${-diff} 天`;
    return `${diff} 天後`;
  }
  function daysUntilMonthlyDay(day){
    const now = new Date(); now.setHours(0,0,0,0);
    let target = new Date(now.getFullYear(), now.getMonth(), day);
    if(target < now){
      target = new Date(now.getFullYear(), now.getMonth()+1, day);
    }
    const diff = Math.round((target-now)/86400000);
    if(diff===0) return "今天";
    return `${diff} 天後`;
  }
  function renderReminders(){
    const box = document.getElementById("reminderList");
    box.innerHTML = "";
    // sort: monthly reminders by upcoming day, dated reminders by date, monthly first if sooner
    const sorted = state.reminders.map((r,i)=>({...r, _i:i})).sort((a,b)=>{
      const aVal = a.monthly ? sortValueForMonthly(a.day) : (a.date? new Date(a.date).getTime() : Infinity);
      const bVal = b.monthly ? sortValueForMonthly(b.day) : (b.date? new Date(b.date).getTime() : Infinity);
      return aVal - bVal;
    });
    sorted.forEach(r=>{
      const row = document.createElement("div");
      row.className = "rem-row";
      if(r.monthly){
        row.innerHTML = `
          <span style="color:var(--accent-amber);font-weight:600;font-size:12.5px;width:110px;flex:none;">每月 ${r.day||'?'} 號</span>
          <span class="rem-title" contenteditable="true">${escapeHtml(r.title)}</span>
          <span class="rem-days">${r.day? daysUntilMonthlyDay(r.day):""}</span>
          <span class="rem-monthly-toggle" style="cursor:pointer;color:var(--text-lo);font-size:11px;margin-right:4px;" title="切換為單次日期">單次</span>
          <span class="rem-del">✕</span>
        `;
        row.querySelector(".rem-monthly-toggle").onclick = ()=>{
          state.reminders[r._i].monthly = false;
          state.reminders[r._i].day = null;
          saveState(); renderReminders();
        };
      } else {
        row.innerHTML = `
          <input type="date" class="rem-date-input" value="${r.date||''}" style="background:transparent;border:none;color:var(--accent-blue);font-size:12.5px;font-weight:600;width:110px;">
          <span class="rem-title" contenteditable="true">${escapeHtml(r.title)}</span>
          <span class="rem-days">${daysFromToday(r.date)}</span>
          <span class="rem-monthly-toggle" style="cursor:pointer;color:var(--text-lo);font-size:11px;margin-right:4px;" title="切換為每月固定">每月</span>
          <span class="rem-del">✕</span>
        `;
        row.querySelector(".rem-date-input").addEventListener("change",(e)=>{
          state.reminders[r._i].date = e.target.value; saveState(); renderReminders();
        });
        row.querySelector(".rem-monthly-toggle").onclick = ()=>{
          const d = prompt("設定每月固定第幾號提醒？（輸入 1-31）", "22");
          const num = parseInt(d,10);
          if(num>=1 && num<=31){
            state.reminders[r._i].monthly = true;
            state.reminders[r._i].day = num;
            state.reminders[r._i].date = "";
            saveState(); renderReminders();
          }
        };
      }
      row.querySelector(".rem-title").addEventListener("blur",(e)=>{
        state.reminders[r._i].title = e.target.textContent.trim(); saveState();
      });
      row.querySelector(".rem-del").onclick = ()=>{ state.reminders.splice(r._i,1); saveState(); renderReminders(); };
      box.appendChild(row);
    });
    checkTodayAlerts();
  }
  function sortValueForMonthly(day){
    if(!day) return Infinity;
    const now = new Date(); now.setHours(0,0,0,0);
    let target = new Date(now.getFullYear(), now.getMonth(), day);
    if(target < now) target = new Date(now.getFullYear(), now.getMonth()+1, day);
    return target.getTime();
  }

  function escapeHtml(str){
    return String(str)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

function highlight(text, keyword){

    let html = escapeHtml(text);

    const keywords = keyword

        .trim()

        .split(/\s+/)

        .filter(k=>k);

    keywords.forEach(k=>{

        const reg = new RegExp(

            k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),

            "gi"

        );

        html = html.replace(

            reg,

            '<span class="search-highlight">$&</span>'

        );

    });

    return html;

}


  // ---------- Invoices ----------
  let invoiceEditIndex = null;

  function invoiceMatches(inv, keywords){
    if(!keywords.length) return true;
    const allText = [
      inv.date || "", inv.number || "", inv.company || "",
      inv.item || "", inv.amount || "", inv.note || ""
    ].join(" ").toLowerCase();
    return keywords.every(k => allText.includes(k));
  }

  function renderInvoices(){

    const keywords = input.value.trim().toLowerCase().split(/\s+/).filter(Boolean);

      .map((inv,i)=>({...inv,_i:i}))
      .filter(inv=>invoiceMatches(inv, keywords))
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));

    if(!invoices.length){
      box.innerHTML = `<div class="invoice-empty">${
        keywords.length ? "找不到符合的發票" : "尚未建立發票紀錄"
      }</div>`;
      return;
    }

    box.innerHTML = invoices.map(inv=>{
      const amount = inv.amount !== "" && inv.amount != null
        ? `<span class="invoice-amount">$${Number(inv.amount).toLocaleString()}</span>` : "";

        <div class="invoice-row" data-i="${inv._i}">

            <span class="invoice-date">${escapeHtml(inv.date || "未填日期")}</span>

            <span class="invoice-company">${escapeHtml(inv.company || "")}${amount}</span>
          </div>
          <div class="invoice-sub">
            ${escapeHtml(inv.item || "")}${inv.note ? "　" + escapeHtml(inv.note) : ""}

            <input data-field="date" type="date" value="${escapeHtml(inv.date||"")}">

            <input data-field="item" value="${escapeHtml(inv.item||"")}" placeholder="品項">

            <input data-field="note" value="${escapeHtml(inv.note||"")}" placeholder="備註">
            <div class="actions">
              <button class="save">儲存</button>
              <button class="cancel">取消</button>
              <button class="del">刪除</button>
            </div>
          </div>
        </div>
      `;
    }).join("");

    box.querySelectorAll(".invoice-row").forEach(row=>{

const calcHeader = document.getElementById("calcHeader");
const calcPanel = document.getElementById("calcPanel");
const calcArrow = document.getElementById("calcArrow");

const calcQty = document.getElementById("calcQty");
const calcPrice = document.getElementById("calcPrice");
const calcTotal = document.getElementById("calcTotal");

let updatingCalculator = false;

function formatNumber(num){

    if(Number.isInteger(num)){
        return num;
    }

    return Number(num.toFixed(5));

}

function updateCalculator(changed){

    if(updatingCalculator) return;

    updatingCalculator = true;

    let qty = parseFloat(calcQty.value);
    let price = parseFloat(calcPrice.value);
    let total = parseFloat(calcTotal.value);

    const reverse = document.getElementById("calcReverse").checked;

    if(reverse){

    if(!isNaN(price) && !isNaN(total) && price!==0){

        calcQty.value = formatNumber(total/price);

    }

}
else{

    switch(changed){

        case "qty":

            if(!isNaN(qty) && !isNaN(price)){
                calcTotal.value = formatNumber(qty * price);
            }
            else if(!isNaN(qty) && !isNaN(total) && qty!==0){
                calcPrice.value = formatNumber(total / qty);
            }

            break;

        case "price":

            if(!isNaN(qty) && !isNaN(price)){
                calcTotal.value = formatNumber(qty * price);
            }
            else if(!isNaN(price) && !isNaN(total) && price!==0){
                calcQty.value = formatNumber(total / price);
            }

            break;

        case "total":

            if(!isNaN(qty) && !isNaN(total) && qty!==0){
                calcPrice.value = formatNumber(total / qty);
            }
            else if(!isNaN(price) && !isNaN(total) && price!==0){
                calcQty.value = formatNumber(total / price);
            }

            break;

    }
  }

    updatingCalculator = false;


}

calcQty.addEventListener("input", () => updateCalculator("qty"));
calcPrice.addEventListener("input", () => updateCalculator("price"));
calcTotal.addEventListener("input", () => updateCalculator("total"));

calcHeader.onclick = ()=>{

    const open = calcPanel.style.display==="block";

    calcPanel.style.display = open ? "none":"block";

};

function searchEvents(keyword){

    const keywords = keyword

    .trim()

    .toLowerCase()

    .split(/\s+/)

    .filter(k => k);

    const resultBox = document.getElementById("searchResults");

    if(keyword===""){

        resultBox.classList.remove("show");
        resultBox.innerHTML="";
        return;

    }

    const result=[];

    for(const date in state.events){

        state.events[date].forEach((ev,index)=>{

const allText = (

    (ev.text || "") +

    " " +

    (ev.note || "")

).toLowerCase();

const matched = keywords.every(k =>

    allText.includes(k)

);

if(matched){

    result.push({

        date,

        index,

        event:ev

    });

}

        });

    }

    // 搜尋結果依日期距離今天由近到遠排列
    const today = new Date();
    today.setHours(0,0,0,0);
    result.sort((a,b)=>{
        const da = new Date(a.date);
        const db = new Date(b.date);
        da.setHours(0,0,0,0);
        db.setHours(0,0,0,0);
        return Math.abs(da - today) - Math.abs(db - today);
    });

    if(result.length===0){

        resultBox.classList.add("show");

        resultBox.innerHTML=`
            <div class="search-result">
                找不到符合的資料
            </div>
        `;

        return;

    }

    resultBox.classList.add("show");

    resultBox.innerHTML = result.map(r=>`

        <div class="search-result">

            <div class="search-date">
                📅 ${r.date}
            </div>

            <div class="search-title">

                ${highlight(r.event.text,keyword)}

            </div>

            <div class="search-note">

                ${highlight(r.event.note||"",keyword)}

            </div>

        </div>

    `).join("");

}

  renderAll();
})();
